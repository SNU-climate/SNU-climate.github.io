# 사이트 전역 정보. 값이 {en, ko} 딕셔너리면 언어별로, 문자열이면 두 언어 공통으로 쓴다.
lab:
  name: {en: "Climate System Laboratory", ko: "기후시스템연구실"}
  short: "CSL"
  affiliation:
    en: "School of Earth and Environmental Sciences, Seoul National University"
    ko: "서울대학교 지구환경과학부"
  # tagline·intro: 원본 홈 히어로 문구와 /introduction/ 'Welcome' 원문(영문). ko는 번역.
  tagline:
    en: "Struggle for pushing edge of the human knowledge"
    ko: "인류 지식의 경계를 넓히기 위한 도전"
  lead:                          # 원본 홈 히어로의 부제(basic 테마 히어로)
    en: "Climate change is the most important issue being faced by humanity and the most challenging scientific subject."
    ko: "기후변화는 인류가 직면한 가장 중요한 문제이자 가장 도전적인 과학 주제입니다."
  intro:
    en: >-
      Climate change is the most important issue being faced by humanity and the most challenging
      scientific subject. Climate System Laboratory (CSL) has studied broad topics related to the
      global/local climate changes to understand our climate system and predict future changes in the
      climate system on various time scales. The goal of our research is to explore and accumulate all
      scientific knowledge related to climate prediction by using big-data analysis, AI techniques, and
      numerical modeling. We have always aimed for the best research in the world and will continue to
      do so in the future.
    ko: >-
      기후변화는 인류가 직면한 가장 중요한 문제이자 가장 도전적인 과학 주제입니다. 기후시스템연구실(CSL)은
      기후시스템을 이해하고 다양한 시간 규모에서 기후시스템의 미래 변화를 예측하기 위해 전 지구 및 지역
      기후변화와 관련된 폭넓은 주제를 연구해 왔습니다. 우리 연구의 목표는 빅데이터 분석, 인공지능(AI) 기법,
      수치 모델링을 활용해 기후 예측과 관련된 모든 과학적 지식을 탐구하고 축적하는 것입니다. 우리는 언제나
      세계 최고의 연구를 지향해 왔으며, 앞으로도 그럴 것입니다.
  photo: img/lab-intro.jpg      # 원본 /introduction/ 사진(F7A2039)

