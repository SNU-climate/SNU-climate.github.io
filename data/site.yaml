# 사이트 전역 정보. 값이 {en, ko} 딕셔너리면 언어별로, 문자열이면 두 언어 공통으로 쓴다.
lab:
  name: {en: "Climate System Laboratory", ko: "기후시스템연구실"}
  short: "CSL"
  affiliation:
    en: "School of Earth and Environmental Sciences, Seoul National University"
    ko: "서울대학교 지구환경과학부"
  tagline:
    en: "Understanding how the climate system works — and how it is changing"
    ko: "기후시스템의 작동 원리와 변화를 이해합니다"
  intro:
    en: >-
      The Climate System Laboratory at Seoul National University studies the physical and
      biogeochemical processes that shape Earth's climate. Our research spans the mechanisms of
      climate change, ocean–atmosphere interaction and El Niño dynamics, the carbon cycle, and
      climate prediction, using observations, Earth system models, and theory.
    ko: >-
      서울대학교 기후시스템연구실은 지구 기후를 결정하는 물리·생지화학 과정을 연구합니다.
      관측 자료, 지구시스템모델, 이론을 활용해 기후변화 메커니즘, 해양-대기 상호작용과 엘니뇨 역학,
      탄소순환, 기후 예측을 연구합니다.

