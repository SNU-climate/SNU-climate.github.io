      - {image: research/biogeochemical-arctic-productivity.jpg, caption: {en: "Future Projection in Arctic Productivity", ko: "북극 생산성의 미래 전망"}}
    dois: ["10.1038/ngeo2986", "10.1126/sciadv.aax3308", "10.1038/s41467-020-15924-3"]
    videos: ["ULbrjMLw9GE", "B0oD8gfmKDI"]
    regions: [[45, -100], [52, 128], [-5, -60]]
