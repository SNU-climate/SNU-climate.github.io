  - key: extremes
    title: {en: "High-Impacts Climate Event", ko: "극한 기후 현상"}
    summary:
      en: >-
        Recently, extreme weather/climate events such as heatwave, cold surge, drought, flood, typhoon, and other
        extreme events occur more frequently over the globe. It is a challenging question of how much climate changes
        contribute to the frequent occurrence of extreme events these days. Since extreme climate events have a very
        strong social and economic impact, it is very important to understand the underlying mechanism and to secure
        predictability based on physical understanding. Climate System Laboratory (CSL) investigates mechanisms of the
        various extreme climate events and looks for precursors, which will be used for predicting the events. In
        addition, we examine future changes in extreme events, with a special interest in relative contributions of
        the climate changes and natural long-term climate variability.
      ko: >-
        최근 들어, 전지구적으로 극한기후현상 (한파, 열파, 가뭄, 홍수 등)이 빈번하게 발생하고 있습니다. 하지만, 이러한 빈번한
        극한 기후 발생이 온실가스 증가에 의한 기후변화에 의한 것인지는 아직까지 명확하지 않으며, 극한기후 현상은 사회적,
        경제적으로 매우 강한 영향을 가지기 때문에 현상의 발생 메커니즘 이해하고, 이에 기반한 예측성을 확보 하는 것이 매우
        중요합니다. CSL에서는 극한기후를 발생시키는 장주기 대기 내부역학을 이해하며 극한 기후 현상에 대한 예측인자를 추출하고
        예측가능성을 연구합니다. 또한 기후변화와 이상기후 발생과의 연관성을 연구하고, 지구온난화의 영향을 평가합니다.
    themes:
      en: ["Low-frequency atmospheric dynamics", "Polar-Extratropical Interaction", "Tropospheric-stratospheric interaction", "Mechanisms for high-impacts climate events", "Predictability of high-impacts climate events"]
      ko: ["저주파 대기 역학", "극지-중위도 상호작용", "대류권-성층권 상호작용", "극한 기후 현상의 메커니즘", "극한 기후 현상의 예측성"]
    image: research/extremes-arctic-east-asia-summer.jpg
    figures:
      - {image: research/extremes-arctic-east-asia-summer.jpg, caption: {en: "A significant relation between the Arctic warming and East Asia hot summer", ko: "북극 온난화와 동아시아 여름 폭염의 유의한 관계"}}
      - {image: research/extremes-polar-midlatitude.jpg, caption: {en: "Two distinct influences of Arctic warming on cold winters over North America and East Asia (Kug et al. 2015)", ko: "북극 온난화가 북미와 동아시아의 추운 겨울에 미치는 두 가지 다른 영향 (Kug et al. 2015)"}, doi: "10.1038/ngeo2517"}
    dois: ["10.1038/ngeo2517"]
    videos: ["XKp5Iix2eUY"]
