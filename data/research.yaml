  - key: biogeochemical
    title: {en: "Bio-Geochemical Processes", ko: "지구 생지화학 과정"}
    summary:
      en: >-
        Earth's climate system consists of vegetation, ocean biogeochemistry, and carbon cycle as well as ocean,
        atmosphere, land, and cryosphere, and their mutual interactions play a pivotal role in climate change.
        Recently, the importance of the biogeochemical processes has been recognized increasingly as it has been
        reported that the biogeochemical feedbacks have significant contributions to global/regional climate change.
        Nevertheless, our understanding of the biogeochemical processes is very limited, and it is one of the most
        uncertain components for predicting future climate. Climate System Laboratory (CSL) conducts a pioneering
        research in the global carbon cycle, marine biogeochemical processes, vegetation processes, and their climate
        feedback based on big data analysis and numerical modeling.
      ko: >-
        지구 기후를 구성하고 있는 식생, 에어로졸, 해양생지화학, 탄소 순환 등은 기후시스템과 상호작용하고, 기후변화에 중요한
        역학을 합니다. 최근 들어, 기후변화에 있어 이러한 생지화학 과정 피드백의 역할이 조금씩 보고되면서 과거에 간과되어 왔던
        지구생지화학 과정의 중요성이 강조되고 있습니다. 하지만 여전히 이 분야에 대한 이해 수준은 매우 낮은 실정이며,
        미래기후예측에 가장 불확실한 부분중의 하나이기 때문에, CSL에서는 자료 분석 및 모델링을 통해, 전지구 탄소순환,
        해양생지화학 과정, 식생 변화 과정이 연구되며, 이들의 다양한 기후 피드백을 연구하고 있습니다.
    themes:
      en: ["Global carbon cycle", "Modeling on ocean and terrestrial bio-geochemical process", "Ocean and terrestrial biological (geophysical and geochemical) feedback", "Earth system interaction"]
      ko: ["전지구 탄소순환", "해양·육상 생지화학 과정 모델링", "해양·육상 생물 (생물지구물리·생지화학) 되먹임", "지구시스템 상호작용"]
    image: research/biogeochemical-climate-system.jpg
    figures:
      - {image: research/biogeochemical-climate-system.jpg, caption: {en: "Dunne et al. 2020a", ko: "Dunne et al. 2020a"}}
