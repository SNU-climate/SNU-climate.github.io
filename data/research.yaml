  - key: ocean-atmosphere
    title: {en: "Ocean-Atmosphere Interaction and El Niño", ko: "해양-대기 상호 작용 및 엘니뇨"}
    summary:
      en: >-
        Ocean-atmosphere interaction plays a critical role in climate events and their changes. Climate System
        Laboratory (CSL) pursues to understand how ocean and atmosphere interact under various time/spatial scales and
        background flow, and how the interaction impacts on development, maintainance, and decay of the climate
        phenomena in tropics, mid-latitudes, and polar regions, with a special interest in their predictability. In
        particular, we are doing in-depth research on El Niño/Southern Oscillation, which is the most dominant climate
        phenomenon affecting global climate.
      ko: >-
        해양-대기 상호작용은 기후 현상 및 그 변화에 가장 중요한 역할을 하고 있습니다. 기후 시스템 연구실 (CSL) 에서는 열대 및
        중위도에서 진행되는 다양한 해양-대기 상호작용의 역학과정을 이해하고, 이와 관련된 주요 기후 현상들의 발생/유지 역학,
        예측성을 연구하고 있습니다. 특히, 전지구적으로 가장 큰 기후 변동인 엘니뇨 현상의 역학, 전지구적인 영향, 다른 현상과의
        상호작용, 예측성 등을 심도 있게 연구하고 있습니다.
    themes:
      en: ["El Niño dynamics", "El Niño teleconnection and impacts", "Tropical-Extratropical interaction", "Indian Ocean Dipole and Indian Ocean variability", "Pacific Decadal Oscillation and North Pacific variability", "Inter-basin interaction", "Nonlinear scale interaction"]
      ko: ["엘니뇨 역학", "엘니뇨 원격상관과 영향", "열대-중위도 상호작용", "인도양 쌍극자와 인도양 변동", "태평양 십년 진동과 북태평양 변동", "해양 분지 간 상호작용", "비선형 규모 간 상호작용"]
    image: research/ocean-atmosphere-mjo-east-asia.jpg
    figures:
