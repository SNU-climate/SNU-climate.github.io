topics:
  - key: mechanism
    title: {en: "Mechanism for Climate Changes", ko: "기후변화 메커니즘"}
    summary:
      en: >-
        Climate System Laboratory (CSL) explores mechanisms of the global/regional climate changes, which are
        caused by both anthropogenic forcing and natural variability. In particular, we focus on various climate
        feedbacks, which are resulted from complex interactions among climate system components, since it is a key
        to determine intensity and pattern of the global/regional climate changes. In addition, we pursue to
        understand the various characteristics of regional climate change and investigate their governing
        mechanisms through theory, big data analysis, and numerical modeling approaches. Recently, we are also
        challenging to understand the dynamics of abrupt and irreversible climate changes, which may bring about the
        most critical crisis in our future life.
      ko: |-
        기후변화는 21세기 인류가 직면한 가장 중요한 과제이며, 과학적 난제입니다.

        CSL에서는 온실 가스 증가에 의한 인위적 강제력과 자연변동에 의한 기후변화의 메커니즘을 연구하고 있습니다. 또한, 기후변화의 강도를 결정할 수 있는, 다양한 기후 피드백에 의한 기후 민감도를 연구한다. 특히, 다양한 양상으로 진행되는 지역기후변화의 특성을 이해하고 그 메커니즘을 이론, 자료분석, 모델링을 통하여 규명한다. 해양, 대기, 해빙, 지면, 생지화학과정 등 다양한 기후시스템 요소들과의 상호작용 및 그 변화가 연구된다.
    themes:
      en: ["Anthropogenic climate changes and natural climate variation", "Climate susceptibility", "Regional climate changes and their mechanisms", "Arctic climate changes", "Changes in dominant climate modes", "Paleoclimate"]
      ko: ["인위적 기후변화와 자연 기후변동", "기후 민감도", "지역 기후변화와 그 메커니즘", "북극 기후변화", "주요 기후 모드의 변화", "고기후"]
    image: research/mechanism-arctic-climate-recovery.jpg
