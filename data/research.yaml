# 연구 주제. 백업 자료가 오면 원본 연구실 소개 문구로 교체한다.
# image: static/ 기준 경로(없으면 테마가 기본 그래픽 사용)
# dois: 관련 논문(publications.yaml과 연결) / videos: 관련 유튜브 영상 ID
# regions: 지도·지구본 테마용 대표 지역 [위도, 경도]
topics:
  - key: climate-change
    title: {en: "Climate Change Mechanisms", ko: "기후변화 메커니즘"}
    summary:
      en: >-
        How does the climate system respond to rising — and later declining — CO2? We study
        reversibility and hysteresis of the climate system, including the delayed response of the
        deep ocean and shifts in tropical rainfall under mitigation scenarios.
      ko: >-
        이산화탄소가 증가했다가 다시 감소할 때 기후시스템은 어떻게 반응할까요? 심층 해양의 지연된 반응,
        완화 시나리오에서 열대 강수대의 이동 등 기후시스템의 가역성과 이력현상을 연구합니다.
    image: null
    dois: ["10.1038/s41558-024-01928-0", "10.1038/s41558-021-01211-6"]
    videos: ["Hue-7jhfw5E", "X-Uq1stg17g"]
    regions: [[5, -30], [0, 150]]

  - key: enso
    title: {en: "Ocean–Atmosphere Interaction & ENSO", ko: "해양-대기 상호작용과 엘니뇨"}
    summary:
      en: >-
        El Niño–Southern Oscillation (ENSO) is the strongest year-to-year climate signal on Earth.
        We investigate the dynamics of ENSO diversity, its interaction with other climate modes, and
        how ENSO may change in a warming world.
      ko: >-
        엘니뇨-남방진동(ENSO)은 지구에서 가장 강한 경년 기후 변동입니다. ENSO의 다양성과 역학,
        다른 기후 모드와의 상호작용, 그리고 온난화에 따른 ENSO의 변화를 연구합니다.
    image: null
    dois: []
    videos: ["n8xFW4A_Oc8", "rLo8Va_ZyGA"]
    regions: [[0, -140], [0, 170]]

  - key: carbon-cycle
    title: {en: "Carbon Cycle & Biogeochemistry", ko: "탄소순환과 생지화학 과정"}
    summary:
      en: >-
        Land and ocean ecosystems absorb about half of human CO2 emissions. We study how climate
        variability and change affect terrestrial productivity, permafrost carbon, wildfires, and
        the feedbacks between the biosphere and the physical climate.
      ko: >-
        육상과 해양 생태계는 인간이 배출한 이산화탄소의 약 절반을 흡수합니다. 기후 변동과 변화가
        육상 생산성, 영구동토층 탄소, 산불에 미치는 영향과 생물권-기후 되먹임을 연구합니다.
    image: null
    dois: ["10.1038/ngeo2986", "10.1126/sciadv.aax3308"]
    videos: ["ULbrjMLw9GE", "B0oD8gfmKDI"]
    regions: [[45, -100], [52, 128], [-5, -60]]

  - key: polar
    title: {en: "Polar Climate & Arctic Amplification", ko: "극지 기후와 북극 증폭"}
    summary:
      en: >-
        The Arctic is warming much faster than the global mean. We study the processes behind Arctic
        amplification — including the physiological effect of CO2 on vegetation — and its links to
        mid-latitude weather and ecosystems.
      ko: >-
        북극은 전 지구 평균보다 훨씬 빠르게 따뜻해지고 있습니다. 식생에 대한 이산화탄소의 생리적 효과를
        포함해 북극 증폭의 원인과 중위도 날씨·생태계와의 연결을 연구합니다.
    image: null
    dois: ["10.1038/s41467-020-15924-3"]
    videos: ["br6dk9cHB8w"]
    regions: [[80, 0], [-78, 175]]

  - key: prediction
    title: {en: "Climate Prediction", ko: "기후 예측"}
    summary:
      en: >-
        From seasonal forecasts to decadal and centennial projections, we work to improve how
        models predict climate and to understand the sources of predictability.
      ko: >-
        계절 예측부터 수십 년·백 년 규모의 전망까지, 기후 예측 성능을 높이고 예측 가능성의 근원을
        이해하기 위한 연구를 합니다.
    image: null
    dois: []
    videos: ["DaqKSaZQapQ"]
    regions: [[37.5, 127], [0, -110]]
