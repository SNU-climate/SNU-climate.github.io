  - key: modeling
    title: {en: "Climate Modeling and Prediction", ko: "기후모델링 및 기후예측"}
    summary:
      en: >-
        The climate model, which virtually simulates our climate system, is a useful tool to understand and predict
        climate phenomena and climate changes. A hypothesis from the data analysis can be proved and supported by
        climate modeling. Climate System Laboratory (CSL) conducts research for improving climate models to
        accurately represent climate phenomena and increase climate predictability. In addition, we are interested in
        predicting multi-decadal climate variability, which mutually interacts with biogeochemical processes, carbon
        cycle, and other factors. Practically, we have contributed to having better climate predictability over the
        Korean Peninsula, collaborating with Korea Meteorological Administration.
      ko: >-
        기후 현상 및 기후 변화를 이해하기 위해 가상의 지구 기후시스템을 수치화한 기후모형을 이용합니다. 관측데이터를 분석한
        결과에서 제시된 가설은 기후 모형을 통해 보완되고 증명되며 CSL은 기후시스템 모형의 해양, 대기 등의 물리화과정을 개선하여
        기후모의 성능 향상을 위한 연구를 진행하고 있습니다. 뿐만 아니라 에어로졸, 생지화학과정, 탄소순환 등을 포괄하는
        지구시스템 모형을 개발하고, 이를 활용한 미래 기후변화를 예측하고 있습니다. 기후모형에 초기화 과정을 결합하여 계절내
        진동에서 수십년 예측 시스템을 구축하고, 그 예측률을 평가하며 기후예측 분야에 대한 기상청과의 긴밀한 협력을 통해 우리나라
        기후예측 능력을 향상시키는데 기여하고 있습니다.
    themes:
      en: ["Climate system modeling and physical Parameterizations", "Earth system model with bio-geochemical processes", "Seamless climate prediction system from intraseasonal to interdecadal", "Optimal perturbation and climate prediction", "Climate Predictability", "Model Output Statistics"]
      ko: ["기후시스템 모델링과 물리 모수화", "생지화학 과정을 포함한 지구시스템 모델", "계절내~수십 년 규모의 끊김 없는(seamless) 기후예측 시스템", "최적 섭동과 기후예측", "기후 예측성", "모델 출력 통계(MOS)"]
