bio:
  en: >-
    Jong-Seong Kug is a Professor in the School of Earth and Environmental Sciences at Seoul
    National University. He received his Ph.D. from Seoul National University in 2003 and worked at
    the University of Hawaii, the Korea Institute of Ocean Science and Technology, and the Pohang
    University of Science and Technology (POSTECH) before joining SNU in 2024. His research focuses
    on climate change mechanisms, ocean–atmosphere interaction and El Niño dynamics, the carbon
    cycle, and Earth's biogeochemical processes.
  ko: >-
    국종성 교수는 서울대학교 지구환경과학부 교수입니다. 2003년 서울대학교에서 박사 학위를 받았고,
    하와이대학교, 한국해양과학기술원, 포항공과대학교(POSTECH)를 거쳐 2024년 서울대학교에 부임했습니다.
    기후변화 메커니즘, 해양-대기 상호작용 및 엘니뇨 역학, 탄소순환, 지구 생지화학 과정을 연구합니다.

