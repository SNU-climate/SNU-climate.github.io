# main에 반영되면 확정 테마를 빌드·검증해 GitHub Pages에 배포한다.
# Pull Request에서는 빌드·검증만 한다(오류가 있으면 병합 전에 빨간 X로 보인다).
name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  THEME: t5.v02   # 배포 테마. 테마를 바꾸면 이 줄만 고친다.

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Build
        run: python scripts/build.py --theme "$THEME"
      - name: Validate
        run: python scripts/validate.py --theme "$THEME"
      - name: Upload site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/${{ env.THEME }}

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
