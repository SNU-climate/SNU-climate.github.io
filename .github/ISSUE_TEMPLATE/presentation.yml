name: 학회 발표
description: 학회·세미나 발표를 발표 목록에 추가해 달라고 요청합니다.
title: "[발표] "
body:
  - type: input
    id: date
    attributes:
      label: 발표 날짜
      placeholder: 2026-12-14
    validations:
      required: true
  - type: input
    id: event
    attributes:
      label: 학회명 / 장소
      placeholder: AGU Fall Meeting 2026 / San Francisco, CA, USA
    validations:
      required: true
  - type: input
    id: title
    attributes:
      label: 발표 제목
    validations:
      required: true
  - type: input
    id: presenters
    attributes:
      label: 발표자 (논문 표기 형식)
      placeholder: Hong, G.-D., Kug, J.-S.
    validations:
      required: true
  - type: dropdown
    id: type
    attributes:
      label: 형식
      options:
        - oral
        - poster
        - invited
        - keynote
        - seminar
    validations:
      required: true
  - type: input
    id: link
    attributes:
      label: 초록·슬라이드 링크 (선택)
