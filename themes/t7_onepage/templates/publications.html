{% extends 'base.html' %}
{% block head %}
<h1 id="page-title">{{ t('pubs.title') }}</h1>
<p class="lead">{{ t('pubs.intro') }}</p>
{% endblock %}

{% block content %}
<nav class="years" data-spy aria-label="{{ 'Years' if lang == 'en' else '연도' }}">
  {% for year, items in pubs_by_year %}<a href="#y{{ year }}">{{ year }}<span class="years-n">{{ items|length }}</span></a>{% endfor %}
</nav>
<div class="card pubs-card pubs-card--full">
  {{ m.pub_list(pubs_by_year) }}
</div>
{% endblock %}
