title: "Science Magazine v02"
concept:
  en: >-
    Science Magazine pushed further: every year of the lab becomes an "Annual Issue" with an automatic
    cover (cover paper, journal, paper count) and its own table of contents of papers, news, photo
    essays and videos; a Journal Desk shows each top journal's papers and yearly record; and the video
    page pairs each explainer video with the paper it is based on ("Watch & Read").
  ko: >-
    과학 잡지 확장판. 연구실의 한 해 한 해를 "연간호"로 묶어 표지(대표 논문·학술지·논문 수)를 자동으로 만들고,
    그해의 논문·뉴스·포토 에세이·영상을 차례로 엮었다. 학술지별 "저널 데스크"에서 상위 학술지의 논문과
    연도별 기록을 보여 주고, 영상 페이지는 해설 영상과 바탕 논문을 짝지어 보여 준다("Watch & Read").
palette: ["#b5121b", "#161513", "#fbf9f4", "#1d3550", "#c8a24a"]
# 공통 8페이지 외 페이지: 소개·갤러리 + 연간호·저널 데스크
