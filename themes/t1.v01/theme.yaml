title: "Classic Academic v01"
concept:
  en: >-
    The refined Classic Academic site. News is grouped by year with a sticky year index and category filter, photo
    albums move to their own Gallery, each research area gets its own page with every original figure, and the People
    page opens with the member list while the professor's full CV moves to a separate profile page.
  ko: >-
    Classic Academic 정제판. 뉴스는 연도별로 묶고 왼쪽에 연도 색인과 분류 필터를 두었으며, 사진 앨범은 별도 갤러리로
    분리했다. 연구 분야마다 원본 그림을 모두 담은 상세 페이지를 만들고, 구성원 페이지는 목록이 바로 보이게 한 뒤 교수 전체
    이력은 개인 페이지로 옮겼다.
palette: ["#0b2a5b", "#ffffff", "#f2f5fa", "#2c5a9a", "#b8954a"]
# 공통 8페이지 외 페이지: 앨범 89편을 뉴스에서 분리
extra_pages: [gallery]
# 교수 개인 페이지(people/jong-seong-kug.html)에 전체 이력을 둔다
pi_page: true
