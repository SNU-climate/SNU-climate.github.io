title: "Sidebar Portfolio"
concept:
  en: >-
    A clean academic portfolio in the al-folio tradition: a fixed left sidebar with the lab name,
    menu, language toggle and contact details, and a calm reading column on the right. The home page
    is centred on the PI (profile, news, selected papers); publications carry colour-coded journal badges.
    On phones the sidebar folds into a top bar with a collapsible menu.
  ko: >-
    al-folio 계열의 깔끔한 학술 포트폴리오. 왼쪽 고정 사이드바(연구실명·메뉴·언어 토글·연락처)와
    오른쪽의 차분한 본문 칸으로 구성한다. 홈은 연구책임자 중심(소개·뉴스·대표 논문)이고, 논문 목록에는
    학술지 약칭 배지를 색으로 구분해 붙인다. 휴대폰에서는 사이드바가 상단 바와 접는 메뉴로 바뀐다.
palette: ["#0b6a8a", "#ffffff", "#212529", "#f6f7f9", "#9c1d3b"]
fonts: ["Roboto", "Roboto Slab", "Pretendard"]
