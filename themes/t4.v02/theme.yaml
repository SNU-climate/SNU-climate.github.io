title: "Climate Dashboard v02"
concept:
  en: "Extended dashboard on top of v01: the warming stripes are linked to the lab's papers (hover a year for ΔT, paper count and lab-led share, click to jump to that year), research regions sit on a Pacific-centred radar map with topic filters, and a co-author network shows who the lab publishes with over time."
  ko: "v01 위에 기능을 더한 확장판: 온난화 줄무늬와 연구실 논문을 한 시간축에 묶어 연도마다 기온 편차·논문 수·연구실 주도 비율을 보여 주고(클릭하면 그해 논문으로 이동), 연구 지역을 태평양 중심 레이더 지도와 주제 필터로, 공저 네트워크로 기간별 협력 관계를 보여 준다."
palette: ["#0b0f16", "#121a26", "#5cc8ff", "#ff7a45", "#e8eef6"]
extra_pages: [gallery]
pi_page: true

