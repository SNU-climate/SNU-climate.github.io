title: "Modern Minimal v02"
concept:
  en: >-
    Modern Minimal pushed further: a hairline index strip of papers per year (2000–2026) under the hero numbers,
    a numbered study-region map of the five research areas on real coastlines, journal / featured / corresponding /
    video filters on the publication index, and a two-column paper-and-video list linking each talk to its paper.
  ko: >-
    Modern Minimal 확장판. 히어로 숫자 아래에 연도별 논문 수를 얇은 세로선으로 그린 연표 띠, 실제 해안선 위에
    다섯 연구 주제의 연구 지역을 번호로 겹친 지도, 논문 목록의 학술지·대표·교신·영상 필터, 영상마다 연결 논문과
    연구 주제를 왼쪽에 둔 논문↔영상 2단 목록을 더했다.
palette: ["#111111", "#ffffff", "#e5482d", "#f4f4f2", "#6b6b6b"]
fonts: ["Inter", "Pretendard"]
