title: "Interactive Globe v02"
concept:
  en: "Extended Interactive Globe on a light \"science map\" palette (white page, pale-blue globe, deep teal/orange accents): study regions are tinted areas on the globe that open an explorer card with the area's papers and videos; the night side of the Earth is softly shaded in real time; a publication timeline (2000–2026) lets you slide or play through each year's papers; research pages tour their study regions with a zooming lens."
  ko: "Interactive Globe 확장판(밝은 \"과학 지도\" 팔레트: 흰 바탕, 옅은 파랑 지구본, 짙은 청록·주황 강조색). 지구본의 연구 지역이 반투명 색 영역으로 표시되고, 누르면 그 분야의 논문·영상을 담은 탐색 카드가 열린다. 지금 이 순간 밤인 지역을 실시간으로 옅게 칠한다. 논문 타임라인(2000–2026)을 밀거나 재생해 해마다의 논문을 훑어보고, 연구 주제 페이지는 확대 렌즈로 연구 지역을 차례로 둘러본다."
palette: ["#ffffff", "#f5f8fb", "#00796b", "#c2410c", "#0b1a2e"]
