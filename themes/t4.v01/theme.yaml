title: "Climate Dashboard v01"
concept:
  en: "Refined dashboard: news become a filterable log by year with albums moved to a Gallery, the PI CV moves to its own page so People opens with the team, members get profile pages with personal KPIs, and Korean labels switch from monospace to sans."
  ko: "정제판: 뉴스는 연도별·분류별 로그로, 앨범 89건은 갤러리로 분리했다. 교수 이력은 개인 페이지로 옮겨 구성원 목록이 바로 보이고, 구성원 개인 페이지(개인 지표)와 연구 주제 페이지를 더했으며, 국문 라벨은 모노 대신 본문 글꼴로 바꿨다."
palette: ["#0b0f16", "#121a26", "#5cc8ff", "#ff7a45", "#e8eef6"]
extra_pages: [gallery]
pi_page: true

