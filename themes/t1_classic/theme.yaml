title: "Classic Academic"
concept:
  en: >-
    A traditional university laboratory site. Deep navy on white, serif headings with sans-serif body text,
    a utility bar with SNU and SEES links, a large laboratory masthead with a horizontal menu, an isobar-pattern
    banner, date–title news rows, and a deep navy footer.
  ko: >-
    전통적인 대학 연구실 홈페이지. 흰 바탕에 짙은 네이비, 세리프 제목과 산세리프 본문, 서울대·학부 링크가 있는
    상단 유틸리티 바, 큰 연구실명 헤더와 가로 메뉴, 등압선 패턴 배너, 날짜-제목 행 형식의 뉴스, 짙은 네이비 푸터.
palette: ["#0b2a5b", "#ffffff", "#f2f5fa", "#2c5a9a", "#b8954a"]
