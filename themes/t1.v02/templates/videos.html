{% extends 'base.html' %}
{% block ptitle %}{{ t('videos.title') }}{% endblock %}
{% block plead %}{{ t('videos.intro') }} <a class="phead-link" href="{{ channel.url or site.links.youtube }}" target="_blank" rel="noopener">{{ t('videos.channel') }} <span aria-hidden="true">→</span></a>{% endblock %}

{% block content %}
<div class="wrap">
  <div class="grid grid-3 videos-grid">
    {% for v in videos %}{{ m.video_card(v) }}{% else %}<p class="empty">{{ t('common.empty') }}</p>{% endfor %}
  </div>
</div>
{% endblock %}
