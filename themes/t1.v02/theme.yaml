title: "Classic Academic v02"
concept:
  en: >-
    The expanded Classic Academic site, built on v01. A History page lays 27 years of papers, the professor's career
    and awards, graduations and lab news on one chronicle, and each year opens into an annual record. The People page
    adds a formal alumni table, member profiles are linked, and the home banner carries real figures from the lab's
    research with their source papers.
  ko: >-
    v01을 바탕으로 한 Classic Academic 확장판. 연혁 페이지에 27년간의 논문, 교수 경력·수상, 졸업생 배출, 연구실 소식을
    한 연표로 엮고 연도마다 그해 논문·소식·사진·영상을 모은 연간 기록을 펼쳐 볼 수 있게 했다. 구성원 페이지에는 졸업생
    진로 표를 두고 개인 페이지를 연결했으며, 홈 배너에는 연구실 논문의 실제 그림을 출처와 함께 실었다.
palette: ["#0b2a5b", "#ffffff", "#f2f5fa", "#2c5a9a", "#b8954a"]
# 공통 8페이지 외 페이지: 갤러리(앨범 분리) + 연혁(history.html)
extra_pages: [gallery, history]
pi_page: true

