title: "Modern Minimal v01"
concept:
  en: >-
    Refined Modern Minimal: news now uses the same pinned-year two-column index as publications, with a category
    filter and text-only rows; 89 albums move to a black-and-white Gallery; research topics get their own pages
    with the original figures, and People opens with a short PI card so the member grid starts right away.
  ko: >-
    Modern Minimal 정제판. 뉴스도 논문처럼 왼쪽에 연도가 붙는 2단 목록(분류 필터·글자 행)으로 바꾸고, 앨범 89건은
    흑백 갤러리로 분리했다. 연구 주제마다 원본 그림이 들어간 상세 페이지를 두고, 구성원 페이지는 짧은 교수 카드로
    시작해 구성원 격자가 바로 이어진다.
palette: ["#111111", "#ffffff", "#e5482d", "#f4f4f2", "#6b6b6b"]
fonts: ["Inter", "Pretendard"]
extra_pages: [gallery]
