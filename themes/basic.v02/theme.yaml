title: "Basic v02"
concept:
  en: "Extended Basic: keeps the original menus and adds a notice board with category tabs and search, publication timelines and in-lab co-authors on every profile, Pacific-centered study-region maps for the research areas, and an index that maps posts of the old site to their new pages."
