title: "Modern Minimal"
concept:
  en: >-
    Editorial minimalism: generous white space and large type in black and white with a single
    vermilion accent. Numbered sections (01 Research, 02 People …), hairline grid rules, and a
    two-column publication list whose year stays pinned on the left while you scroll.
  ko: >-
    에디토리얼 미니멀리즘. 넓은 여백과 큰 타이포그래피, 흑백에 주홍색 포인트 하나만 쓴다.
    번호 붙은 섹션(01 연구, 02 구성원 …), 얇은 그리드 선, 스크롤해도 연도가 왼쪽에 붙어 있는 2단 논문 목록.
palette: ["#111111", "#ffffff", "#e5482d", "#f4f4f2", "#6b6b6b"]
fonts: ["Inter", "Pretendard"]
